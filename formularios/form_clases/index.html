<!DOCTYPE html>
<html lang="en" >
<head>
  <meta charset="UTF-8">
  <title>CodePen - Responsive Signup/Login form</title>
  <link href="https://fonts.googleapis.com/css?family=Montserrat:400,700|Raleway:300,600" rel="stylesheet">
<meta name="viewport" content="width=device-width, initial-scale=1"><link rel='stylesheet' href='https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/3.3.7/css/bootstrap.min.css'><link rel="stylesheet" href="./style.css">

</head>
<body>
<!-- partial:index.partial.html -->

<div class="video-bg">
   <video width="320" height="240" autoplay loop muted>
    <source src="https://assets.codepen.io/3364143/7btrrd.mp4" type="video/mp4">
  Tu navegador no es compatible con esta pagina.    </video>
</div>

<div class="container">
   <section id="formHolder">

      <div class="row">

         <!-- Brand Box -->
         <div class="col-sm-6 brand">
            <div class="heading">
               <h2 style="font-size: 50px; color: rgb(0, 47, 255);">Registro Clases</h2>
               <br>
               <p>Tecno Prector</p>
            </div>
            
            <div class="success-msg">
               <p>Great! You are one of our members now</p>
               <a href="#" class="profile">Your Profile</a>
            </div>
         </div>


         <!-- Form Box -->
         <div class="col-sm-6 form">

            <!-- Login Form -->
            <div class="login form-peice switched">
               <form class="login-form" action="#" method="post">
                  <div class="form-group">
                     <label for="loginemail">Usuario</label>
                     <input type="text" name="usuario" id="loginemail" required>
                  </div>

                  <div class="form-group">
                     <label for="loginPassword">Contraseña</label>
                     <input type="password" name="password" id="loginPassword" required>
                  </div>

                  <div class="CTA">
                     <input type="submit" value="Iniciar">
                     <a href="#" class="switch">Soy Nuevo</a>
                  </div>
               </form>
            </div><!-- End Login Form -->


            <!-- Signup Form -->
            <div class="signup form-peice">
               <form class="signup-form" action="#" method="post">

                  <div class="form-group">
                     <label for="name">Nombre Completo</label>
                     <input type="text" name="nombre" id="name" class="name" required>
                     <span class="error"></span>
                  </div>

                  <div class="form-group">
                     <label for="email">Correo</label>
                     <input type="email" name="email" id="email" class="email" required>
                     <span class="error"></span>
                  </div>

                  <div class="form-group">
                     <label for="phone">Numero Contacto | <small>Optional</small></label>
                     <input type="text" name="contacto" id="phone">
                  </div>

                  <div class="form-group">
                     <label for="password">Contraseña</label>
                     <input type="password" name="password" id="password" class="pass">
                     <span class="error"></span>
                  </div>

                  <!-- <div class="form-group">
                     <label for="passwordCon">Confirm Password</label>
                     <input type="password" name="passwordCon" id="passwordCon" class="passConfirm">
                     <span class="error"></span>
                  </div> -->

                  <br>

                  <div class="form-group">
                     <select name="area" id="" style="scale: (1.1);" required>
                        <option value="#">Seleccionar Una Area</option>
                        <option value="matematicas">Matematicas</option>
                        <option value="ciencias">Ciencias Naturales</option>
                        <option value="idiomas">idiomas Extrangeros</option>
                        <option value="artes">Artes Graficas</option>
                     </select>   
                     <span class="error"></span>
                  </div>   

                  <div class="CTA">
                     <input type="submit" value="Registrar" id="submit">
                     <a href="#" class="switch">I have an account</a>
                  </div>
               </form>
            </div><!-- End Signup Form -->
         </div>
      </div>

   </section>

</div>
<!-- partial -->
  <script src='https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/3.3.7/js/bootstrap.min.js'></script>
<script src='https://cdnjs.cloudflare.com/ajax/libs/jquery/3.1.0/jquery.min.js'></script><script  src="./script.js"></script>

</body>
</html>
